spring:
  application:
    name: mocking-engine-state-simulator
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  # Habilitación de Virtual Threads de Java 21 (Project Loom)
  # Permite pausar peticiones de forma asíncrona sin bloquear el hilo del SO
  threads:
    virtual:
      enabled: true

  # Configuración del DataSource (PostgreSQL)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mockengine_db}
    username: ${SPRING_DATASOURCE_USERNAME:mockengine_user}
    password: ${SPRING_DATASOURCE_PASSWORD:mockengine_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # Configuración de JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # 'update' para desarrollo inicial: crea/actualiza tablas automáticamente
      # En producción corporativa se suele usar 'validate' con Flyway/Liquibase
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Configuración de Spring Data MongoDB (Persistencia Políglota)
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/mockengine_logs}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Configuración de Actuator para comprobar la salud del servicio
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Configuración de Logs
logging:
  level:
    com.mockengine: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Configuración de Seguridad y JWT
app:
  jwt:
    # Lee JWT_SECRET del entorno (.env o variable del sistema). Si no está definida, usa clave fallback para tests
    secret: ${JWT_SECRET:dGVzdC1zZWNyZXQta2V5LWZvci1sb2NhbC1kZXYtb25seS1kby1ub3QtdXNlLWluLXByb2QtMjU2Yml0cw==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123456}


