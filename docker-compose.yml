services:
  postgres:
    image: postgres:16-alpine
    container_name: mockengine-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mockengine
      POSTGRES_USER: mockuser
      POSTGRES_PASSWORD: mocksecret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mockuser -d mockengine"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: mockengine-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: mockengine_logs
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
